<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>{{ data.message }}</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-stroked-button type="button" data-testid="confirm-dialog-cancel" (click)="cancel()">
    {{ data.cancelLabel }}
  </button>
  <button mat-flat-button type="button" data-testid="confirm-dialog-confirm" (click)="confirm()">
    {{ data.confirmLabel }}
  </button>
</mat-dialog-actions>
