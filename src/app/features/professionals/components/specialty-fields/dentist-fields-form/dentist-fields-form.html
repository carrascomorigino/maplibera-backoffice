<div [formGroup]="form" class="flex flex-col gap-4">
  <mat-form-field class="min-w-0">
    <mat-label>{{ language.t().professionals.specialtyFields.dentist.licenseNumberLabel }}</mat-label>
    <input
      matInput
      data-testid="dentist-license-number"
      formControlName="licenseNumber"
      (blur)="onBlur()"
    />
  </mat-form-field>

  <label class="flex items-center gap-2 text-sm text-ink-700">
    <input type="checkbox" data-testid="dentist-accepts-children" formControlName="acceptsChildren" />
    {{ language.t().professionals.specialtyFields.dentist.acceptsChildrenLabel }}
  </label>
</div>
