<div [formGroup]="form" class="flex flex-col gap-4">
  <div>
    <label class="mb-1 block text-sm font-medium text-ink-700">
      {{ language.t().resources.categoryFields.nutrition.sourceLinksLabel }}
    </label>
    <app-string-list-editor
      formControlName="sourceLinks"
      [urlMode]="true"
      [addButtonLabel]="
        language.t().stringListEditor.addRowButton(
          language.t().resources.categoryFields.nutrition.sourceLinksLabel
        )
      "
    />
  </div>

  <div>
    <label class="mb-1 block text-sm font-medium text-ink-700">
      {{ language.t().resources.categoryFields.nutrition.pdfUrlsLabel }}
    </label>
    <app-string-list-editor
      formControlName="pdfUrls"
      [urlMode]="true"
      [addButtonLabel]="
        language.t().stringListEditor.addRowButton(
          language.t().resources.categoryFields.nutrition.pdfUrlsLabel
        )
      "
    />
  </div>
</div>
