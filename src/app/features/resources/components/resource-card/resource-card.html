<div class="flex items-start justify-between gap-2">
  <div class="flex items-center gap-2">
    <mat-checkbox
      data-testid="select-checkbox"
      [checked]="selected()"
      (change)="selectionToggled.emit()"
      [attr.aria-label]="language.t().bulkSelection.itemCheckboxAria(resource().slug)"
    />
    <span cdkDragHandle data-testid="drag-handle" aria-hidden="true" class="cursor-move text-ink-300 hover:text-ink-500">
      <mat-icon>drag_indicator</mat-icon>
    </span>
  </div>
  <span
    data-testid="status-badge"
    class="rounded-full px-2 py-1 text-xs font-medium"
    [class]="statusBadgeClass(resource().status)"
  >
    {{ resource().status }}
  </span>
</div>

@if (thumbnailUrl()) {
  <img [src]="thumbnailUrl()" alt="" class="h-32 w-full rounded-lg object-cover" />
} @else {
  <div
    data-testid="thumbnail-placeholder"
    class="flex h-32 w-full items-center justify-center rounded-lg bg-surface-sunken text-ink-300"
  >
    <mat-icon>image</mat-icon>
  </div>
}

<p data-testid="resource-title" class="font-medium text-ink-900">{{ translation()?.title }}</p>
<p class="line-clamp-2 text-sm text-ink-500">{{ translation()?.shortDescription }}</p>

<app-language-tags
  [languages]="contentLanguages"
  [translatedLanguages]="availableLanguages()"
  [staleLanguages]="resource().staleLanguages ?? {}"
  [selectedLanguage]="selectedLanguage()"
  (languageSelected)="onLanguageSelected($event)"
  (translateRequested)="onTranslateRequested($event)"
  (languageRemoved)="onLanguageRemoved($event)"
/>

<div class="mt-auto flex gap-2">
  <button mat-stroked-button type="button" data-testid="edit-button" (click)="onEdit()">
    {{ language.t().resources.resourcesList.editButton }}
  </button>
  <button
    mat-stroked-button
    type="button"
    [attr.data-testid]="'status-action-' + resource().slug"
    (click)="onStatusAction()"
  >
    {{ statusActionLabel(resource().status) }}
  </button>
</div>
