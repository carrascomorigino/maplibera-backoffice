<div class="p-6 md:p-8">
  <h1 class="mb-6 text-2xl font-semibold tracking-tight text-ink-900">
    {{ language.t().dashboard.heading }}
  </h1>

  <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
    @for (card of cards(); track card.key) {
      <a
        [routerLink]="card.routerLink"
        [attr.data-testid]="'dashboard-card-' + card.key"
        class="flex flex-col gap-3 rounded-lg border border-ink-100 bg-surface-card p-6 transition-colors hover:border-brand-300 hover:bg-brand-50"
      >
        <span class="text-sm font-medium text-ink-500">{{ card.label }}</span>
        <span data-testid="count-total" class="text-3xl font-semibold text-ink-900">{{ card.total }}</span>
        <div class="flex flex-wrap gap-x-4 gap-y-1 text-xs text-ink-500">
          <span>{{ language.t().dashboard.publishedLabel }}: <span data-testid="count-published">{{ card.published }}</span></span>
          <span>{{ language.t().dashboard.draftLabel }}: <span data-testid="count-draft">{{ card.draft }}</span></span>
          <span>{{ language.t().dashboard.pausedLabel }}: <span data-testid="count-paused">{{ card.paused }}</span></span>
        </div>
      </a>
    }
  </div>
</div>
