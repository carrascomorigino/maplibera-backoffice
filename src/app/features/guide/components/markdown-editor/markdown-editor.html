<div class="flex flex-col gap-2">
  <div
    class="flex flex-wrap items-center gap-1"
    role="toolbar"
    [attr.aria-label]="language.t().guide.markdownEditor.toolbarAriaLabel"
  >
    <button
      mat-icon-button
      type="button"
      data-testid="bold-button"
      [attr.aria-label]="language.t().guide.markdownEditor.boldLabel"
      [disabled]="previewing() || disabled()"
      (click)="applyBold()"
    >
      <mat-icon>format_bold</mat-icon>
    </button>
    <button
      mat-icon-button
      type="button"
      data-testid="italic-button"
      [attr.aria-label]="language.t().guide.markdownEditor.italicLabel"
      [disabled]="previewing() || disabled()"
      (click)="applyItalic()"
    >
      <mat-icon>format_italic</mat-icon>
    </button>
    <button
      mat-icon-button
      type="button"
      data-testid="heading-button"
      [attr.aria-label]="language.t().guide.markdownEditor.headingLabel"
      [disabled]="previewing() || disabled()"
      (click)="applyHeading()"
    >
      <mat-icon>title</mat-icon>
    </button>
    <button
      mat-icon-button
      type="button"
      data-testid="bulleted-list-button"
      [attr.aria-label]="language.t().guide.markdownEditor.bulletedListLabel"
      [disabled]="previewing() || disabled()"
      (click)="applyBulletedList()"
    >
      <mat-icon>format_list_bulleted</mat-icon>
    </button>
    <button
      mat-icon-button
      type="button"
      data-testid="numbered-list-button"
      [attr.aria-label]="language.t().guide.markdownEditor.numberedListLabel"
      [disabled]="previewing() || disabled()"
      (click)="applyNumberedList()"
    >
      <mat-icon>format_list_numbered</mat-icon>
    </button>
    <button
      mat-icon-button
      type="button"
      data-testid="link-button"
      [attr.aria-label]="language.t().guide.markdownEditor.linkLabel"
      [disabled]="previewing() || disabled()"
      (click)="applyLink()"
    >
      <mat-icon>link</mat-icon>
    </button>

    <button
      mat-stroked-button
      type="button"
      class="ml-auto"
      data-testid="preview-toggle"
      [attr.aria-pressed]="previewing()"
      (click)="togglePreview()"
    >
      {{ previewing() ? language.t().guide.markdownEditor.editButton : language.t().guide.markdownEditor.previewButton }}
    </button>
  </div>

  @if (previewing()) {
    <div
      data-testid="markdown-preview"
      class="min-h-32 rounded border border-gray-300 p-3"
      [innerHTML]="renderedHtml()"
    ></div>
  } @else {
    <textarea
      #textarea
      data-testid="markdown-textarea"
      class="min-h-32 w-full rounded border border-gray-300 p-2 font-mono text-sm"
      [value]="value()"
      [disabled]="disabled()"
      (input)="onInput(textarea.value)"
      (blur)="onBlur()"
    ></textarea>
  }
</div>
