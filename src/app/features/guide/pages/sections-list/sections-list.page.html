<mat-drawer-container class="h-full">
  <mat-drawer #drawer mode="over" position="end" [opened]="isDrawerOpen()" (closedStart)="onCancelled()">
    @if (isDrawerOpen()) {
      <app-section-form-drawer
        [section]="drawerSection()"
        [targetLanguage]="drawerTargetLanguage()"
        [sourceLanguage]="drawerSourceLanguage()"
        [staleSourceLanguage]="drawerStaleSourceLanguage()"
        (saved)="onSaved()"
        (cancelled)="onCancelled()"
      />
    }
  </mat-drawer>

  <mat-drawer-content class="p-6 md:p-8">
    <div class="mb-6 flex items-center justify-between">
      <h1 class="text-2xl font-semibold tracking-tight text-ink-900">
        {{ language.t().guide.sectionsList.heading }}
      </h1>
      <button
        mat-flat-button
        type="button"
        data-testid="new-section-button"
        (click)="openCreate()"
      >
        {{ language.t().guide.sectionsList.newSectionButton }}
      </button>
    </div>

    @if (sections().length === 0) {
      <p
        class="rounded-xl border border-dashed border-ink-200 bg-surface-muted p-8 text-center text-sm text-ink-500"
      >
        {{ language.t().guide.sectionsList.emptyState }}
      </p>
    } @else {
      <ul
        cdkDropList
        [cdkDropListData]="sections()"
        class="flex flex-col gap-2"
        (cdkDropListDropped)="onDrop($event)"
      >
        @for (section of sections(); track section.slug) {
          <li
            cdkDrag
            tabindex="0"
            [attr.aria-label]="language.t().guide.sectionsList.reorderAriaLabel(section.slug)"
            class="flex items-center gap-4 rounded-xl border border-ink-100 bg-surface-card p-3 shadow-[0_1px_2px_-1px_rgba(23,21,31,0.06),0_1px_3px_rgba(23,21,31,0.04)] transition-shadow hover:shadow-[0_2px_4px_-1px_rgba(23,21,31,0.08),0_4px_8px_rgba(23,21,31,0.05)]"
          >
            <app-section-list-item
              [section]="section"
              [resetRequest]="cancelledSelection()"
              (editRequested)="openEdit($event)"
              (translateRequested)="openTranslate($event)"
            />
          </li>
        }
      </ul>
    }
  </mat-drawer-content>
</mat-drawer-container>
